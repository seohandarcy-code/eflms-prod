<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:'IBM Plex Sans',system-ui,sans-serif; }
</style>
</helmet>

<div style="width:760px;height:560px;background:#F4F5F7;color:#1A2230;padding:24px;position:relative;">
  <div style="font-size:14px;font-weight:700;">1-A. Three.js 실제 3D (WebGL)</div>
  <div style="font-size:11.5px;color:#C4392B;font-weight:600;margin-top:2px;">⚠ 실제 구현 아님 · 개념 참고 이미지</div>

  <svg width="712" height="420" viewBox="0 0 712 420" style="margin-top:10px;">
    <defs>
      <radialGradient id="redBall" cx="35%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#F0958A"/>
        <stop offset="55%" stop-color="#C4392B"/>
        <stop offset="100%" stop-color="#8E2419"/>
      </radialGradient>
      <radialGradient id="tealBall" cx="35%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#8FC7C7"/>
        <stop offset="55%" stop-color="#3E8E8E"/>
        <stop offset="100%" stop-color="#245656"/>
      </radialGradient>
    </defs>

    <!-- perspective floor -->
    <g opacity="0.5">
      <ellipse cx="356" cy="330" rx="300" ry="70" fill="none" stroke="#C7CCD3" stroke-width="1"/>
      <ellipse cx="356" cy="330" rx="220" ry="52" fill="none" stroke="#C7CCD3" stroke-width="1"/>
      <ellipse cx="356" cy="330" rx="140" ry="34" fill="none" stroke="#C7CCD3" stroke-width="1"/>
      <line x1="56" y1="330" x2="656" y2="330" stroke="#C7CCD3" stroke-width="1"/>
      <line x1="356" y1="260" x2="356" y2="400" stroke="#C7CCD3" stroke-width="1"/>
    </g>

    <!-- axes -->
    <line x1="356" y1="330" x2="356" y2="70" stroke="#5B6472" stroke-width="2"/>
    <line x1="356" y1="330" x2="560" y2="230" stroke="#5B6472" stroke-width="2"/>
    <line x1="356" y1="330" x2="170" y2="250" stroke="#5B6472" stroke-width="2"/>
    <text x="340" y="58" font-family="IBM Plex Sans" font-size="15" font-weight="700" fill="#4A5361">DoF</text>
    <text x="568" y="228" font-family="IBM Plex Sans" font-size="15" font-weight="700" fill="#4A5361">PoF</text>
    <text x="130" y="252" font-family="IBM Plex Sans" font-size="15" font-weight="700" fill="#4A5361">CoF</text>

    <!-- spheres with drop shadows (fake 3D depth) -->
    <g>
      <ellipse cx="300" cy="345" rx="16" ry="6" fill="#000" opacity="0.12"/>
      <circle cx="300" cy="300" r="16" fill="url(#tealBall)"/>
      <ellipse cx="400" cy="352" rx="14" ry="5" fill="#000" opacity="0.12"/>
      <circle cx="400" cy="312" r="14" fill="url(#tealBall)"/>
      <ellipse cx="330" cy="368" rx="20" ry="7" fill="#000" opacity="0.15"/>
      <circle cx="330" cy="315" r="20" fill="url(#redBall)"/>
      <ellipse cx="380" cy="378" rx="18" ry="6" fill="#000" opacity="0.15"/>
      <circle cx="380" cy="330" r="18" fill="url(#redBall)"/>
      <ellipse cx="440" cy="300" rx="13" ry="5" fill="#000" opacity="0.1"/>
      <circle cx="440" cy="265" r="13" fill="url(#tealBall)"/>
    </g>
  </svg>

  <div style="position:absolute;left:24px;bottom:70px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #E2E5EA;border-radius:999px;padding:6px 14px;font-size:12px;color:#4A5361;box-shadow:0 2px 6px rgba(0,0,0,.06);">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0F8A8A" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    드래그로 자유 회전 · 스크롤로 확대/축소
  </div>
  <div style="position:absolute;right:24px;bottom:24px;font-size:11px;color:#8891A0;">렌더링: WebGL(Three.js) — 구체·그림자·원근감으로 실제 3D 공간 느낌</div>
</div>
</x-dc>
</body>
</html>
