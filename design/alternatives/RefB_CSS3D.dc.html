<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:'IBM Plex Sans',system-ui,sans-serif; }
</style>
</helmet>

<div style="width:760px;height:560px;background:#F4F5F7;color:#1A2230;padding:24px;position:relative;">
  <div style="font-size:14px;font-weight:700;">1-B. 순수 CSS 3D transform (라이브러리 없음)</div>
  <div style="font-size:11.5px;color:#C4392B;font-weight:600;margin-top:2px;">⚠ 실제 구현 아님 · 개념 참고 이미지</div>

  <svg width="712" height="420" viewBox="0 0 712 420" style="margin-top:10px;">
    <!-- flat skewed grid plane (CSS transform look, no gradients/shadow) -->
    <g stroke="#D7DBE0" stroke-width="1">
      <line x1="80" y1="300" x2="632" y2="300"/>
      <line x1="110" y1="330" x2="602" y2="330"/>
      <line x1="140" y1="360" x2="572" y2="360"/>
      <line x1="60" y1="270" x2="360" y2="60"/>
      <line x1="200" y1="270" x2="440" y2="60"/>
      <line x1="340" y1="270" x2="520" y2="60"/>
      <line x1="480" y1="270" x2="600" y2="60"/>
    </g>

    <!-- axes -->
    <line x1="356" y1="300" x2="356" y2="80" stroke="#5B6472" stroke-width="1.5"/>
    <line x1="356" y1="300" x2="540" y2="220" stroke="#5B6472" stroke-width="1.5"/>
    <line x1="356" y1="300" x2="180" y2="230" stroke="#5B6472" stroke-width="1.5"/>
    <text x="340" y="68" font-family="IBM Plex Sans" font-size="14" font-weight="700" fill="#4A5361">DoF</text>
    <text x="548" y="218" font-family="IBM Plex Sans" font-size="14" font-weight="700" fill="#4A5361">PoF</text>
    <text x="140" y="232" font-family="IBM Plex Sans" font-size="14" font-weight="700" fill="#4A5361">CoF</text>

    <!-- flat circles, no gradient/shadow: simpler CSS-transform aesthetic -->
    <circle cx="300" cy="270" r="7" fill="#3E8E8E"/>
    <circle cx="400" cy="282" r="7" fill="#3E8E8E"/>
    <circle cx="330" cy="290" r="9" fill="#C4392B"/>
    <circle cx="380" cy="300" r="9" fill="#C4392B"/>
    <circle cx="440" cy="250" r="6.5" fill="#3E8E8E"/>
  </svg>

  <div style="position:absolute;left:24px;bottom:70px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #E2E5EA;border-radius:6px;padding:6px 14px;font-size:12px;color:#4A5361;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0F8A8A" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    드래그로 회전(rotateX/rotateY) — 겹치는 점의 앞뒤 순서는 수동 계산 필요
  </div>
  <div style="position:absolute;right:24px;bottom:24px;font-size:11px;color:#8891A0;">렌더링: CSS transform(perspective) — 평면적·가벼움, 정교함은 A안보다 낮음</div>
</div>
</x-dc>
</body>
</html>
